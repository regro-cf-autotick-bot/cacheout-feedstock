{% set name = "cacheout" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cacheout-{{ version }}.tar.gz
  sha256: 38e6ead5828e718e8451029fe9b6c0c6f9ca351cf321c73f8e06b60e4af27ad1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - cacheout
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/dgilland/cacheout
  summary: A caching library for Python.
  license: MIT
  license_file: LICENSE.rst
  license_family: MIT
  dev_url: https://github.com/dgilland/cacheout
  doc_url: https://cacheout.readthedocs.io

extra:
  recipe-maintainers:
    - claytonparnell
